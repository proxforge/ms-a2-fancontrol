# gitleaks configuration: the default secret rules plus checks for local network and machine
# data, which must not end up in this public repository either.
title = "ms-a2-fancontrol"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private IPv4 address (LAN or lab data)"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
tags = ["local-data"]

[[rules]]
id = "windows-user-path"
description = "Windows user profile path"
regex = '''(?i)\b[a-z]:\\{1,2}users\\{1,2}[a-z0-9_][^\\\s"'`]*'''
tags = ["local-data"]
